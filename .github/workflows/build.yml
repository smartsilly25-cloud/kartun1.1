name: Build Offline EXE (single file)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build single EXE
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name FotoKartunOffline
          --collect-all customtkinter
          --collect-all diffusers
          --collect-all transformers
          --copy-metadata torch
          --copy-metadata tqdm
          --copy-metadata regex
          --copy-metadata requests
          --copy-metadata packaging
          --copy-metadata filelock
          --copy-metadata numpy
          --copy-metadata tokenizers
          --copy-metadata huggingface-hub
          --copy-metadata safetensors
          --copy-metadata transformers
          --copy-metadata diffusers
          --copy-metadata accelerate
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoKartunOffline
          path: dist/FotoKartunOffline.exe

      - name: Publish release (exe langsung, tanpa zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Foto Kartun Offline build ${{ github.run_number }}
          files: dist/FotoKartunOffline.exe
